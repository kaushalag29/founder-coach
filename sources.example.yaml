# Copy to sources.yaml (git-ignored) and edit, or let `ytbrain discover` build it:
#   cp sources.example.yaml sources.yaml
#   ytbrain discover --method ytdlp --channel @SomeChannel
#
# Two Source types (ADR-0013):
#   YouTube playlists: a PLAYLIST id (PL... or a channel's uploads UU...), never a channel id
#     (UC...). Specific playlists win over a `fallback: true` catch-all.
#   Websites: `type: website` and a `url`; everything else is optional and worked out from the
#     pages themselves (docs/web-sources-plan.md). Needs: uv pip install -e ".[web]", and for
#     JavaScript sites: playwright install chromium
# `domains: [leadership]` on any entry says which subject(s) its Documents belong to (names declared in
# domains.yaml; default: startup). A Book in a folder named after a Domain needs no tag. After changing tags
# run `ytbrain index`: it re-tags in place, nothing is re-fetched or re-extracted.
# `enabled: false` on any entry stops fetching it (its Documents stay until `ytbrain drop --source ID`).
defaults:                              # applied to every source unless it overrides them
  sub_langs: en,en-orig,en-US,en-GB    # exact English tracks (en.* also pulls machine translations)
  sub_format: srt/best
  sleep_requests: 5                    # seconds between yt-dlp requests; >= 5 avoids most YouTube 429s
sources:
- id: how_to_start_a_startup_2014      # stable slug, unique
  name: How to Start a Startup (CS183B, 2014)
  kind: playlist
  playlist_id: PL11qn6zM2Y3bMZdChxEqHKaCaKUjwItGL
  fallback: false
# - id: channel_uploads                # optional catch-all: every upload of a channel
#   name: Channel uploads
#   kind: playlist
#   playlist_id: UUxxxxxxxxxxxxxxxxxxxxxx
#   fallback: true
- type: website                        # crawled politely: robots.txt, 1 request/s per host, no login
  url: https://paulgraham.com/articles.html
  depth: 1                             # link hops from the start page (default 3)
  render: auto                         # auto (browser only when a page's text is thin) | always | never
  enabled: true
  author: Paul Graham                  # optional: the speaker when a page names no author
#   id and name default from the URL; a name you write is the series (else the site's own name);
#   max_pages (default 10000 per run)
# - type: website
#   url: https://www.ycombinator.com/library
#   render: always                     # a JavaScript site

# PDF Books you own (ADR-0014): one Document per Chapter, text only, private (never in the Knowledge pack).
# Title, subtitle, authors, year and ISBN are detected (copyright page, then the PDF's metadata); correct
# only what is wrong. Check first: ytbrain books inspect data/books
# - type: pdf_books
#   path: data/books                   # a folder (every PDF in it and in any subfolder you add, e.g. startup/,
#                                      # leadership/, finance/; the caches are skipped) or one file; relative to the repo
#   # or several:  path: [data/books/startup, ~/Documents/more-books]   (file names must be unique)
#   distribute: false                  # books are private: the only value in v1
#   lookup: openlibrary                # optional: fill still-missing fields from openlibrary.org by ISBN
#   books:                             # optional, by file name
#     "Zero to One.pdf":
#       authors: [Peter Thiel, Blake Masters]
#       subtitle: Notes on Startups, or How to Build the Future
#     "The Lean Startup.pdf":
#       chapters:                      # corrects the detected split; page = printed label or PDF page
#         - {page: 274, title: Join the Movement}   # renames the chapter that starts there
#         - {page: 12, skip: true}                  # a detected start that isn't one
#       # chapters_only: true          # use exactly this list instead of detection
